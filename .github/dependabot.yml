# Dependabot v2 config.
# Auto-PRs for vulnerable + outdated dependencies across pyproject.toml
# files and GitHub Actions workflows.

version: 2
updates:
  # Core empirica package
  - package-ecosystem: pip
    directory: "/"
    # Land bumps on develop (our trunk), not the default branch (main) — so they
    # get CI-tested on develop and flow to main via the normal release, instead
    # of landing on main and needing a manual back-port.
    target-branch: "develop"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      pinned-security:
        # Group all the security-CVE-pinned deps so one PR rolls them
        # together rather than fragmenting across 8 PRs.
        patterns:
          - "cryptography"
          - "gitpython"
          - "lxml"
          - "pydantic"
          - "python-dotenv"
          - "python-multipart"
          - "requests"
      lint-and-test:
        patterns:
          - "ruff"
          - "pyright"
          - "pytest*"
    ignore:
      # ruff is pinned to a minor range ON PURPOSE — see the comment on the pin in
      # pyproject.toml: patches auto-pick-up, minors do not, because a new minor
      # brings new lint rules and those have repeatedly turned CI red after a green
      # local run. Widening the ceiling is a deliberate act taken when we want a
      # ruff feature, not a dependency chore.
      #
      # Without this, dependabot re-proposes the same ceiling bump every week and a
      # reviewer eventually merges it without reading the pin's rationale. Closing
      # #386/#387 by hand only works until next Monday.
      - dependency-name: "ruff"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # MCP wrapper package
  - package-ecosystem: pip
    directory: "/empirica-mcp"
    target-branch: "develop"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    ignore:
      # Same rationale as the root block — and this one is not redundant: #387
      # proposed the identical ceiling widening against empirica-mcp/pyproject.toml
      # specifically. An ignore on the root package does not cover this directory,
      # so omitting it here would silence half the noise and leave the other half
      # arriving every Monday.
      - dependency-name: "ruff"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
