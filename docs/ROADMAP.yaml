# Empirica's forecast of its own next directions. `scripts/release.py --docs` renders the open items as README's "What's Coming".
#
# This is a PREDICTION, not a promise, and it is graded:
#   * every item carries a confidence (0-1), the KIND of evidence its basis rests on, and the observation that would prove it wrong;
#   * the evidence kind caps the confidence (the release script refuses a higher one):
#       measured  a command produced the figure and it was run for this forecast      up to 0.95
#       reviewed  read in the code or the data, not run                               up to 0.85
#       reported  someone else's report about code that may have changed since        up to 0.70
#       inferred  reasoned from patterns, nothing checked                             up to 0.60
#     Use the weakest kind any load-bearing part of the basis rests on. Attention belongs where confidence is low and the stakes are high;
#     a reader sees the kind beside the number and can tell a measured 85% from a reported 65%.
#   * when a release ships an item, set `status: shipped` and `resolved_in: <version>`; when it is abandoned, `status: dropped` and
#     `resolved_in`. Resolved items leave the table and move into the "Forecast record" count, so the hit rate is public;
#   * gardening keeps the forecast honest, as it does for findings: a prediction that was wrong when written (its basis was false) is
#     `retracted`, not `dropped`; a replaced one is `superseded` with `superseded_by`; every predicted item names a `horizon` (a release),
#     and the docs step flags each one that has passed; `steered: true` means a goal for it already existed when it was predicted, and
#     those are scored separately (delivering planned work is not foresight); a change to confidence, prediction, falsifier, horizon or
#     evidence after a release needs a dated entry under `revisions`, and an item is never deleted, only resolved;
#   * a falsifier must test the PREDICTION, not a neighbouring claim, and must be checkable by someone outside the project;
#   * check each prediction against HEAD before writing it: a settled fact is not a forecast (one item here described a gap that had
#     been fixed three weeks earlier, from a peer's report of older code);
#   * the text is public. No proposal, goal, task or commit ids, and no one else's internal state (the release script refuses ids).
#
# Drafted from the practice's own graph (open goals, measured faults, unresolved unknowns) and confirmed by a human before it ships.
# Quote `made_in`: an unquoted 1.10 loads as the number 1.1.

forecast:
  made_in: "1.14.14"
  made_on: "2026-10-25"

items:
  - id: correctness-backlog
    title: A run of correctness releases
    prediction: The next two releases fix at least a third of a backlog of 78 reproduced defects, and their changelogs say how many.
    confidence: 0.85
    evidence: measured
    basis: A systematic sweep reproduced 78 medium-or-high defects, summed from seven open fix goals covering the data layer, the transaction handlers, resolvers, sync, chat, the Sentinel and the mailbox. None of the seven has a completed task yet.
    falsifier: The next two changelogs together cite fewer than 26 of them.
    horizon: "1.14.16"
    steered: true
    status: shipped
    resolved_in: "1.14.16"
    reason: Graded at 1.14.16. The three lists the two releases worked through (data layer, canonical and mailbox, resolvers and config) hold 32 of the 78 defects, 41%, and all 32 are closed; a few were one defect listed twice or already fixed when reproduced. 1.14.15 states the count in its changelog. Its Fixed section groups defects by area instead of citing each one, so the falsifier's literal reading (26 cited individually) is not cleanly met; the claim it guards (a third fixed, the number published) is.

  - id: bootstrap-whole-picture
    title: Bootstrap shows the whole picture
    prediction: project-bootstrap lists open assumptions, includes the links between artifacts, and says when it capped findings, decisions, dead ends or mistakes.
    confidence: 0.75
    evidence: measured
    basis: Measured on this project today, it shows 10 of 3,173 findings, 10 of 758 decisions, 5 of 835 dead ends and 5 of 447 mistakes with no notice (goals and unknowns do get one), none of the 115 open assumptions, and only project-level relations, not the links between artifacts.
    falsifier: A bootstrap run on a graph larger than its caps that omits open assumptions or caps findings without saying so.
    horizon: "1.14.17"
    steered: true
    status: predicted

  - id: budget-save-visible
    title: Session start reports a skipped budget save
    prediction: When session start cannot save the context-budget state, the banner says so instead of only recording it.
    confidence: 0.8
    evidence: reviewed
    basis: Read in the session-init hook, the skip reason is recorded in the budget summary but the banner prints only the budget line. The deploy-gap check already skips outside Claude Code, so that half of the gap is closed.
    falsifier: A session start with no resolvable sessions.db prints a banner that does not mention the unsaved budget state.
    horizon: "1.14.16"
    steered: true
    status: predicted

  - id: listener-memory
    title: Listener memory stays flat
    prediction: Within three releases a listener's memory stops growing with uptime, and a dead notification stream is restarted.
    confidence: 0.65
    evidence: reported
    basis: Operators of long-running listeners report about 30 MB an hour in one case and over 1 GB at 29 hours in another, with a stream process that was not respawned after a drop. We have not yet reproduced it on a fresh unit.
    falsifier: On a release that claims the fix, a listener's memory grows by more than 50 MB between hour 4 and hour 24 of uptime.
    horizon: "1.14.17"
    steered: true
    status: predicted

  - id: cockpit-rejoin
    title: Restarted cockpit panes rejoin the mesh unprompted
    prediction: After a cockpit restart, resumed sessions re-arm their listener and catch up on mail without anyone typing, using the wake and inbox poll added in 1.14.14.
    confidence: 0.55
    evidence: reported
    basis: Reported after a restart, 1 of about 12 resumed sessions armed its listener and another first armed 68 minutes after resume. Read in the code, cockpit refresh does not yet call the wake or the inbox poll.
    falsifier: After a cockpit restart on a release that claims it, more than 2 of 12 resumed sessions are still unarmed 5 minutes later.
    horizon: "1.14.17"
    steered: true
    status: predicted

  - id: wake-default
    title: Wake service on by default
    prediction: The wake service stops being opt-in once a few weeks of live use show no wake into a busy pane.
    confidence: 0.35
    evidence: measured
    basis: It passed a live trial on two seats and refuses busy panes, drafts and dialogs. Open edge cases are an image-only prompt that can read as blank and a spinner scrolled out of view that reads as idle.
    falsifier: A report of a wake that interrupted a running turn or submitted a half-typed draft.
    horizon: "1.15.0"
    steered: false
    status: predicted
