# Empirica's forecast of its own next directions. `scripts/release.py --docs` renders the open items as README's "What's Coming".
#
# This is a PREDICTION, not a promise, and it is graded:
#   * every item carries a confidence (0-1), the KIND of evidence its basis rests on, and the observation that would prove it wrong;
#   * the evidence kind caps the confidence (the release script refuses a higher one):
#       measured  a command produced the figure and it was run for this forecast      up to 0.95
#       reviewed  read in the code or the data, not run                               up to 0.85
#       reported  someone else's report about code that may have changed since        up to 0.70
#       inferred  reasoned from patterns, nothing checked                             up to 0.60
#     Use the weakest kind any load-bearing part of the basis rests on. Attention belongs where confidence is low and the stakes are high;
#     a reader sees the kind beside the number and can tell a measured 85% from a reported 65%.
#   * when a release ships an item, set `status: shipped` and `resolved_in: <version>`; when it is abandoned, `status: dropped` and
#     `resolved_in`. Resolved items leave the table and move into the "Forecast record" count, so the hit rate is public;
#   * gardening keeps the forecast honest, as it does for findings: a prediction that was wrong when written (its basis was false) is
#     `retracted`, not `dropped`; a replaced one is `superseded` with `superseded_by`; every predicted item names a `horizon` (a release),
#     and the docs step flags each one that has passed; `steered: true` means a goal for it already existed when it was predicted, and
#     those are scored separately (delivering planned work is not foresight); a change to confidence, prediction, falsifier, horizon or
#     evidence after a release needs a dated entry under `revisions`, and an item is never deleted, only resolved;
#   * a falsifier must test the PREDICTION, not a neighbouring claim, and must be checkable by someone outside the project;
#   * check each prediction against HEAD before writing it: a settled fact is not a forecast (one item here described a gap that had
#     been fixed three weeks earlier, from a peer's report of older code);
#   * the text is public. No proposal, goal, task or commit ids, and no one else's internal state (the release script refuses ids).
#
# Drafted from the practice's own graph (open goals, measured faults, unresolved unknowns) and confirmed by a human before it ships.
# Quote `made_in`: an unquoted 1.10 loads as the number 1.1. Quote the `on` key of a revision too: unquoted, `on:` is the boolean true in YAML 1.1.

forecast:
  made_in: "1.14.14"
  made_on: "2026-10-25"

items:
  - id: correctness-backlog
    title: A run of correctness releases
    prediction: The next two releases fix at least a third of a backlog of 78 reproduced defects, and their changelogs say how many.
    confidence: 0.85
    evidence: measured
    basis: A systematic sweep reproduced 78 medium-or-high defects, summed from seven open fix goals covering the data layer, the transaction handlers, resolvers, sync, chat, the Sentinel and the mailbox. None of the seven has a completed task yet.
    falsifier: The next two changelogs together cite fewer than 26 of them.
    horizon: "1.14.16"
    steered: true
    status: shipped
    resolved_in: "1.14.16"
    reason: Graded at 1.14.16. The three lists the two releases worked through (data layer, canonical and mailbox, resolvers and config) hold 32 of the 78 defects, 41%, and all 32 are closed; a few were one defect listed twice or already fixed when reproduced. 1.14.15 states the count in its changelog. Its Fixed section groups defects by area instead of citing each one, so the falsifier's literal reading (26 cited individually) is not cleanly met; the claim it guards (a third fixed, the number published) is.

  - id: bootstrap-whole-picture
    title: Bootstrap shows the whole picture
    prediction: project-bootstrap lists open assumptions, includes the links between artifacts, and says when it capped findings, decisions, dead ends or mistakes.
    confidence: 0.65
    evidence: measured
    basis: Open assumptions and a per-type coverage of what the caps hid (shown, total, truncated, source) shipped in 1.14.19. Still absent are the links between artifacts and the status of the last blindspot scan, and decisions are still read from an unordered Qdrant page.
    falsifier: A bootstrap run on a graph larger than its caps that omits open assumptions or caps findings without saying so.
    horizon: "1.14.20"
    steered: true
    status: shipped
    resolved_in: "1.14.20"
    reason: Graded at 1.14.20. On this practice's real graph, project-bootstrap lists 10 of 96 open assumptions, says 10 of 771 decisions (newest first, from SQLite), caps findings, dead ends and mistakes with a coverage entry each, and lists the semantic links among the artifacts shown (3 here), with the last blindspot scan status. Mistakes carry no id, so they are not endpoints of a link. Tested, and run once on the real data; the falsifier case (a graph larger than the caps) is this practice.
    revisions:
      - "on": "2026-10-26"
        from: 0.75
        to: 0.65
        reason: Not delivered by its 1.14.17 horizon, because project-bootstrap was not changed in 1.14.18, which went to the pre-publish sweep, the test and code-quality evidence contracts, and the suite speed-up. The horizon moves to 1.14.20 and the confidence drops, because a prediction that misses its horizon was over-confident about when.

  - id: budget-save-visible
    title: Session start reports a skipped budget save
    prediction: When session start cannot save the context-budget state, the banner says so instead of only recording it.
    confidence: 0.7
    evidence: reviewed
    basis: Read in the session-init hook, the skip reason is recorded in the budget summary but the banner prints only the budget line. The deploy-gap check already skips outside Claude Code, so that half of the gap is closed.
    falsifier: A session start with no resolvable sessions.db prints a banner that does not mention the unsaved budget state.
    horizon: "1.14.19"
    steered: true
    status: shipped
    resolved_in: "1.14.19"
    reason: Graded at 1.14.19. The session-start banner now appends the reason when the context-budget state was skipped or failed to save, and says when budget initialisation errored. Shown by tests of the banner line; not exercised by a live session start with no resolvable sessions.db.
    revisions:
      - "on": "2026-10-25"
        from: 0.8
        to: 0.7
        reason: Not started by its 1.14.16 horizon, and the code still only records the skip reason in the summary. The last three releases went to the review sweep and to reader-audited changes of how vectors and CHECK confidence are stored, so the horizon moves to 1.14.19 and the confidence drops, because a prediction that misses its horizon was over-confident about when.

  - id: listener-memory
    title: Listener memory stays flat
    prediction: Within three releases a listener's memory stops growing with uptime, and a dead notification stream is restarted.
    confidence: 0.5
    evidence: reported
    basis: Operators of long-running listeners report about 30 MB an hour in one case and over 1 GB at 29 hours in another, with a stream process that was not respawned after a drop. We have not yet reproduced it on a fresh unit. From 1.14.20 the listener logs its memory next to its activity, so the growth can be attributed, and a quiet stream that drops no longer waits five minutes with no stream process.
    falsifier: On a release that claims the fix, a listener's memory grows by more than 50 MB between hour 4 and hour 24 of uptime.
    horizon: "1.14.22"
    steered: true
    status: shipped
    resolved_in: "1.14.22"
    revisions:
      - "on": "2026-10-26"
        from: 0.65
        to: 0.55
        reason: Not delivered by its 1.14.17 horizon, because the listener code was not changed in 1.14.18 (the loops only gained terminal-401 handling), so nothing could have moved its memory growth. The horizon moves to 1.14.20 and the confidence drops, because a prediction that misses its horizon was over-confident about when.
      - "on": "2026-11-04"
        from: 0.55
        to: 0.5
        reason: Not delivered by its 1.14.20 horizon. That release adds the stats line that attributes the growth and removes the five-minute window with no stream process after a quiet drop, but the memory growth itself is neither reproduced nor fixed, so nothing could have stopped it. The horizon moves to 1.14.22 and the confidence drops, because a prediction that misses its horizon was over-confident about when.
      - "on": "2026-11-10"
        from: 0.5
        to: 0.5
        reason: Shipped in 1.14.22, which gives every listener HTTPS call one SSL context per process; the growth was native memory held by a new context every 60 seconds. Measured from the listeners' own stats lines on one machine, all five units started after the fix grew 9.5 to 13.7 MB between hour 4 and hour 24 of uptime, under the falsifier's 50 MB. The run on the same unit before the fix grew from 233 MB to 949 MB over the same hours.

  - id: cockpit-rejoin
    title: Restarted cockpit panes rejoin the mesh unprompted
    prediction: After a cockpit restart by launch or by refresh, resumed sessions re-arm their listener and catch up on mail without anyone typing, using the wake and inbox poll added in 1.14.14.
    confidence: 0.35
    evidence: reported
    basis: Reported after a restart, 1 of about 12 resumed sessions armed its listener and another first armed 68 minutes after resume. As of 1.14.19 cockpit refresh wakes each resumed claude pane once it is idle, which gives it the turn that arms the listener; that is tested with fakes and has not been measured on a live cockpit. The one live restart measured since (0 of 6 resumed panes armed before a human prompt) was a kill-server then launch, so the refresh wake never ran, and the listener wake service was off on every unit, so it grades neither. Launch gets the same wake as refresh in 1.14.22, tested with fakes, not yet measured on a live cockpit.
    falsifier: After a cockpit restart on a release that claims it, more than 2 of 12 resumed sessions are still unarmed 5 minutes later.
    horizon: "1.16.0"
    steered: true
    status: predicted
    revisions:
      - "on": "2026-10-26"
        from: 0.55
        to: 0.45
        reason: Not delivered by its 1.14.17 horizon, because cockpit refresh still does not call the wake or the inbox poll; this range touched cockpit code only for 401 handling and a cron example. The horizon moves to 1.14.20 and the confidence drops, because a prediction that misses its horizon was over-confident about when.
      - "on": "2026-11-04"
        from: 0.45
        to: 0.4
        reason: Not delivered by its 1.14.20 horizon, in the sense that nothing was measured on a live restart. The wake exists since 1.14.19 and is tested with fakes; the cockpits were restarted on that release, but the registry then held only the latest arm per session, so the gap could not be read. From 1.14.20 it keeps first and every recent arm time. The horizon moves to 1.14.21 so the next restart is the first measurement, and the confidence drops, because a prediction that misses its horizon was over-confident about when.
      - "on": "2026-11-05"
        from: 0.4
        to: 0.4
        reason: Past its 1.14.21 horizon but untested rather than wrong. The measured restart did not go through refresh, which is the only path that wakes panes, and a restart by launch is the natural one for a person. The prediction now covers both paths, launch is being changed to wake like refresh, and the horizon moves to 1.14.23 so the next restart is the first real measurement. The confidence stays, because the cause is now known and one fix away, and a missed horizon was already priced in.
      - "on": "2026-11-10"
        from: 0.4
        to: 0.35
        reason: Past its 1.14.23 horizon and still unmeasured. The cockpit server on the machine checked has run since 2 November, before 1.14.22 shipped the launch wake, so no launch restart has happened on it, and no refresh since has been graded. The work it needs is done; the measurement is a restart. The horizon moves to 1.16.0 and the confidence drops, because a prediction that misses its horizon was over-confident about when.

  - id: wake-default
    title: Wake service on by default
    prediction: The wake service stops being opt-in once a few weeks of live use show no wake into a busy pane.
    confidence: 0.3
    evidence: measured
    basis: It passed a live trial on two seats and refuses busy panes, drafts and dialogs. Open edge cases are an image-only prompt that can read as blank and a spinner scrolled out of view that reads as idle.
    falsifier: A report of a wake that interrupted a running turn or submitted a half-typed draft.
    horizon: "1.16.0"
    steered: false
    status: predicted
    revisions:
      - "on": "2026-11-10"
        from: 0.35
        to: 0.3
        reason: Not worked on by its 1.15.0 horizon. The release went to the local server, due dates, the Sentinel default and two review sweeps, and the wake service is still opt-in. The horizon moves to 1.16.0 and the confidence drops, because a prediction that misses its horizon was over-confident about when.

  - id: multi-runner-test-evidence
    title: Two test runners keep both reports
    prediction: A project that runs two test runners, for example pytest and cargo, has both reports read by the next POSTFLIGHT, and a later run no longer replaces the other's.
    confidence: 0.8
    evidence: reviewed
    basis: Read at HEAD, the pytest plugin writes the single shared report file without checking for another runner's report, so whichever runner finishes last decides what is graded. A Rust project that also runs pytest hit the collision and works around it by switching the plugin off for that run.
    falsifier: A project whose evidence directory holds reports from pytest and from a second runner produces a POSTFLIGHT whose test evidence names only one of them.
    horizon: "1.14.19"
    steered: true
    status: shipped
    resolved_in: "1.14.19"
    reason: Graded at 1.14.19. The collector now reads every fresh per-runner test report, keeps the newest per runner, sums the counts and joins the scopes, and the pytest plugin writes its own file, so a second runner's report is no longer replaced. Shown by tests with two fresh runners, a stale one, duplicates of one runner and a malformed neighbour; not yet observed on a project that runs a second runner, since the Rust side has not re-vendored the plugin.

  - id: known-suite-size
    title: A test report can state the suite's size
    prediction: When a runner reports how many tests exist but were not run, POSTFLIGHT's test signal says what share of the suite the pass rate covers.
    confidence: 0.65
    evidence: reported
    basis: A Rust project already writes the counts of ignored and filtered-out tests per test binary and offered to supply the suite total; the reader ignores both counts today, so a filtered rerun and a full run read alike apart from the declared scope.
    falsifier: A report carrying ignored and filtered-out counts produces a POSTFLIGHT signal that does not state the share of the suite covered.
    horizon: "1.14.19"
    steered: true
    status: shipped
    resolved_in: "1.14.19"
    reason: Graded at 1.14.19. A report that carries ignored and filtered_out counts gives the evidence a suite size and POSTFLIGHT's signal reads, for example, 104 of 112, without moving the pass rate. Shown by tests on the collector and the signal; the cargo emitter has not started writing the two counts, so no live report has carried them yet.

  - id: sentinel-discipline-layer
    title: The Sentinel becomes a discipline layer
    prediction: By 1.15.0 the Sentinel's default mode lets trivial work run without a loop up to a budget you set, and records it, while plan-shaped work and outward acts always need one.
    confidence: 0.5
    evidence: reviewed
    basis: The design is accepted. A bash allowlist of about 900 entries keeps refusing honest reads, and CHECK confidence predicts later trouble only weakly (AUROC 0.587 over 4,508 CHECKs on 12 practices). Hooks before and after a command already exist, but read tracking was retired in September, so read-before-write is new work, and nothing added to the hot path has been timed yet.
    falsifier: On the release that claims it, a fresh session's first file edit outside a transaction is refused, or the act budget cannot be set from the config file, an environment variable and a command-line flag.
    horizon: "1.15.0"
    steered: true
    status: shipped
    resolved_in: "1.15.0"

  - id: empirica-local
    title: A local single-user server
    prediction: By 1.15.0 a single-user local server answers the Cortex API from your own practice registry, and says plainly that anything crossing a user or organisation boundary is not supported.
    confidence: 0.4
    evidence: reported
    basis: Specified in the Cortex repository, not built. Core's part is one definition of the practice registry (today two code paths define it and the live table carries a legacy default) and a list of every capability that crosses an identity boundary. Neither is done.
    falsifier: On the release that claims it, a local server is not installable with core alone, or a request that needs a second user or organisation is answered with anything other than a not-supported error.
    horizon: "1.15.0"
    steered: true
    status: shipped
    resolved_in: "1.15.0"

  - id: local-semantic-search
    title: Semantic search on a machine with no Cortex
    prediction: On a machine with no Cortex, semantic search works after onboarding with nothing else to install, because the local server holds the vector store and a multilingual embedding model.
    confidence: 0.6
    evidence: reviewed
    basis: Measured on a fresh machine with no Cortex, Qdrant or Ollama, each practice gets its git repository and database but semantic search is empty; since this release that is reported plainly. The design is written and decided (the server serves the part of Qdrant's API that Empirica uses over an embedded store, and an Ollama-compatible embedding route), and the store's embedded mode was checked to provide every operation needed. Nothing is built yet.
    falsifier: On the release that claims it, a fresh machine with no Cortex, Qdrant or Ollama, after provision-practice, returns nothing from project-search for an artifact it has just logged.
    horizon: "1.16.0"
    steered: true
    status: predicted

  - id: rebuild-assumptions
    title: A rebuild restores assumptions
    prediction: A rebuild from the git notes restores assumptions, with whether each was verified or falsified.
    confidence: 0.7
    evidence: reviewed
    basis: Read in the code, the rebuild recreates findings, unknowns, dead ends, mistakes and goals from their notes but has no branch for assumptions, so a rebuild loses every one; assumption notes also record only the state at creation.
    falsifier: On the release that claims it, an assumption logged, verified and then rebuilt from the notes is missing, or reads as unverified.
    horizon: "1.16.0"
    steered: true
    status: predicted
