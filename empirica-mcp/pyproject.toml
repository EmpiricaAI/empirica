[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empirica-mcp"
version = "1.13.47"
description = "MCP server for Empirica — AI measurement and calibration tools via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "David S. L. Van Assche"},
]
keywords = ["mcp", "empirica", "calibration", "ai", "measurement", "epistemic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # FLOOR at the current core version, ceiling at the next major. release.py
    # bumps the floor in lockstep with [project].version below, so upgrading
    # the wrapper still pulls core up to match (the reason this was once ==).
    # It is no longer ==: an exact pin dragged core back DOWN whenever
    # `pip install -U empirica` ran on a box carrying empirica-mcp. The two
    # imported symbols the pin protected are guarded in core by
    # tests/test_mcp_wrapper_import_surface.py. David's ruling 2026-09-18.
    "empirica>=1.13.47,<2",
    # Spans BOTH SDK majors: server.py detects which is present and registers
    # handlers accordingly (decorators on 1.x, `on_*` constructor params on 2.x).
    # Suite passes 572/572 on 1.28.1 and on 2.0.0.
    #
    # The ceiling stays. `>=1.28.1` with no upper bound is what let 2.0.0 break
    # CI and a published package with no commit of ours — semver majors break by
    # design, so a floor without a ceiling delegates release timing to a third
    # party. Widen to <4 deliberately, after testing against 3.x.
    "mcp>=1.28.1,<3",    # MCP SDK — floor bumped for CVE-2026-52869/-52870/-59950 (fixed 1.27.2/1.28.1); prior: python-multipart CVE-2026-24486 (1.25+)
]

[project.urls]
Homepage = "https://github.com/EmpiricaAI/empirica"
Documentation = "https://github.com/EmpiricaAI/empirica/tree/main/docs"
Repository = "https://github.com/EmpiricaAI/empirica"
Issues = "https://github.com/EmpiricaAI/empirica/issues"

[project.scripts]
empirica-mcp = "empirica_mcp.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["empirica_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.11",
    "ruff>=0.15.18,<0.16",
]
