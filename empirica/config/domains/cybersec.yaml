domain: cybersec
version: "1"
description: "Security-sensitive code and configuration work"

applies_to_work_types:
  - code
  - infra
  - config

# The scanners listed under optional_checks (semgrep_*, trivy_deps, gitleaks, sbom_audit,
# threat_model_current, privilege_review) have no runner registered in ServiceRegistry yet. As
# required checks they made every medium/high/critical run fail with "not registered", so the
# domain could never complete. They are NOT enforced until a runner exists: promote an id back
# to required_checks in the same change that registers it (tests/config/
# test_shipped_domains_and_malformed_files.py fails if a required id has no runner).
criticalities:
  low:
    description: "Hobby projects, prototypes, internal tools with no PII"
    required_checks:
      - tests
      - lint
    optional_checks: []
    thresholds:
      coverage_min: 0.3
      check_pass_ratio: 1.0
    max_iterations: 3

  medium:
    description: "Production services, internal APIs with authenticated users"
    required_checks:
      - tests
      - lint
    optional_checks:
      - semgrep_basic
    thresholds:
      coverage_min: 0.5
      check_pass_ratio: 1.0
    max_iterations: 5

  high:
    description: "Public-facing, handles PII or authentication"
    required_checks:
      - tests
      - lint
    optional_checks:
      - semgrep_full
      - trivy_deps
      - gitleaks
    thresholds:
      coverage_min: 0.7
      check_pass_ratio: 1.0
    max_iterations: 5

  critical:
    description: "Financial, medical, regulated (GDPR, HIPAA, PCI, SOX, AI Act)"
    required_checks:
      - tests
      - lint
    optional_checks:
      - semgrep_full
      - trivy_deps
      - gitleaks
      - sbom_audit
      - threat_model_current
      - privilege_review
    thresholds:
      coverage_min: 0.85
      check_pass_ratio: 1.0
    max_iterations: 8

hints_to_ai:
  - "Log assumptions about trust boundaries explicitly."
  - "Every untrusted input must have an assumption about its source."
