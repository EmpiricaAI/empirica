domain: default
version: "1"
description: "Baseline domain for general-purpose work. Applied when no specific domain is declared."

applies_to_work_types: []  # empty = applies to all

criticalities:
  low:
    description: "Hobby projects, prototypes, internal tools"
    required_checks:
      - tests
    thresholds:
      coverage_min: 0.3
      check_pass_ratio: 1.0
    max_iterations: 3

  medium:
    description: "Production code, internal services"
    required_checks:
      - tests
      - lint
      - complexity
    thresholds:
      coverage_min: 0.3
      check_pass_ratio: 1.0
    max_iterations: 5

  high:
    description: "Public-facing services, authenticated user data"
    required_checks:
      - tests
      - lint
      - complexity
      - dep_audit
    thresholds:
      coverage_min: 0.5
      check_pass_ratio: 1.0
    max_iterations: 5

  critical:
    description: "Regulated, financial, medical, PII-handling"
    required_checks:
      - tests
      - lint
      - complexity
      - dep_audit
      - git_metrics
    thresholds:
      coverage_min: 0.7
      check_pass_ratio: 1.0
    max_iterations: 8

hints_to_ai:
  - "Name what the next action rests on before acting: a file you read, a command you ran, and over what."
  - "Commit after each finished task, so the work is visible to the checks."
  - "A defect you found in the code is a finding; one you introduced is a mistake, logged with how to prevent it."
