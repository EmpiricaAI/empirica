domain: remote-ops
version: "1"
description: "Remote operations — SSH, API calls, infra management. No local deterministic checks apply. The AI's self-assessment stands."

applies_to_work_types:
  - remote-ops

criticalities:
  low:
    description: "Self-assessment stands — no deterministic checks"
    required_checks: []
    thresholds: {}
    max_iterations: 1
  medium:
    description: "Self-assessment stands — no deterministic checks"
    required_checks: []
    thresholds: {}
    max_iterations: 1
  high:
    description: "Self-assessment stands — no deterministic checks"
    required_checks: []
    thresholds: {}
    max_iterations: 1
  critical:
    description: "Self-assessment stands — no deterministic checks"
    required_checks: []
    thresholds: {}
    max_iterations: 1

hints_to_ai:
  - "Nothing local can observe a remote machine: record what you ran there and what it returned, as evidence."
  - "Read before you change: check the remote state first, and say what you will change and how to undo it."
  - "Treat a command that changes a remote machine as outward and hard to reverse; confirm it first."
