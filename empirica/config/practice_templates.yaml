# Practice templates and cockpit presets for onboarding (goal e8c47635, David 2026-11-17).
#
# A template is a kind of practice a person's work tends to need: what it is for, its project type (one of
# `empirica project-init --help`'s types), the domain file it starts from, the skills worth suggesting, and which work
# kinds (the interview's workload answers) make it likely. /ewm-interview drafts practices from these as predictions,
# and a preset is a ready composition of templates a person can start from and adjust.
#
# Each template's `starter` is the first plan its practice gets when onboarding ends (goal 88150eae): one goal and its
# tasks, `{focus}` filled from the person's answers (a repo, a client, a question).
#
# Order matters on a tie: the person's own work (builder, writer, engagement, analyst...) comes before research, so
# it gets the first plan.
#
# Read by empirica.core.practice_templates; tests pin every type, domain and skill to what exists.

workloads:
  build_software: Building or maintaining software
  research: Research and synthesis
  writing: Writing and content
  outreach: Outreach and sales
  client_work: Client or consulting engagements
  operations: Operations and infrastructure
  data: Data and analysis

templates:
  coordinator:
    title: Coordinator
    for: plans across your other practices, hands each its part, and follows up
    type: operations
    domain: operations
    skills: [empirica:forecast]
    suggested_by: []          # suggested whenever there are two or more other practices
    starter:
      objective: "Plan the first two weeks across your practices"
      tasks:
        - "List what each practice should deliver first, with one goal per practice"
        - "Name the order and what each one waits on"
        - "Set a check-in date for each goal"
  support:
    title: System support
    for: "looks after your machine and tools: installs, updates, backups, finding what broke"
    type: infrastructure
    domain: operations
    skills: []
    suggested_by: []          # suggested for everyone; cheap, and every setup needs it
    starter:
      objective: "Check this machine is ready for the practices"
      tasks:
        - "Check Empirica, Claude Code and the local server are current and running"
        - "Check backups of the practice folders"
  builder:
    title: Builder
    for: builds and maintains one codebase or product; one practice per codebase
    type: service             # the interview sets web-app, cli, library, service... per codebase
    domain: default
    skills: [empirica:pre-publish, empirica:code-audit]
    suggested_by: [build_software]
    starter:
      objective: "Get to know {focus}: map it and pick the first tasks"
      tasks:
        - "Map the architecture: entry points, modules, data flow; log findings with how sure you are"
        - "Log what is not understood yet as unknowns"
        - "Propose the first three tasks, smallest first"
  writer:
    title: Writing
    for: drafts, edits and fact-checks documents, posts and reports
    type: content
    domain: docs
    skills: [empirica:epistemic-editing]
    suggested_by: [writing]
    starter:
      objective: "Draft a first piece: {focus}"
      tasks:
        - "Outline it and name its sources"
        - "Write the draft and check every claim against a source"
  outreach:
    title: Outreach
    for: prospects, follow-ups and campaigns, with every message waiting for your approval
    type: content
    domain: marketing
    skills: []
    suggested_by: [outreach]
    starter:
      objective: "First outreach list: {focus}"
      tasks:
        - "Name the people or companies and why each fits"
        - "Draft the first messages for your approval; nothing is sent without it"
  engagement:
    title: Client engagement
    for: one client's work, kept apart from everything else; one practice per client
    type: engagement
    domain: consulting
    skills: [empirica:epistemic-editing]
    suggested_by: [client_work]
    starter:
      objective: "Start the engagement: {focus}"
      tasks:
        - "Write the brief: the client, the outcome they want, the deadline"
        - "Break it into deliverables, one task each"
        - "List what is still unknown about the client and ask"
  operations:
    title: Operations
    for: runs and watches live systems and servers, including ones on other machines
    type: operations
    domain: remote-ops
    skills: []
    suggested_by: [operations]
    starter:
      objective: "First health check: {focus}"
      tasks:
        - "List the systems and how each is checked"
        - "Run the checks and log what is wrong or unknown"
  analyst:
    title: Analysis
    for: "works with your data: pipelines, analyses and the reports that come out of them"
    type: data
    domain: research
    skills: []
    suggested_by: [data]
    starter:
      objective: "A first look at the data: {focus}"
      tasks:
        - "Describe the data and what question it could answer"
        - "Form two hypotheses and test them, with how sure you are"
        - "Report what was found and what to look at next"

  research:
    title: Research
    for: investigates questions and keeps what it learns for your other practices to find
    type: research
    domain: research
    skills: [empirica:forecast]
    suggested_by: [research, data]
    starter:
      objective: "Answer a first question: {focus}"
      tasks:
        - "Write the question and what would count as an answer"
        - "Gather and log findings, with what is still unknown"
        - "Summarise what was learned and what to look at next"

presets:
  solo-builder:
    title: Solo builder
    for: one person shipping software
    templates: [builder, research, support]
  researcher:
    title: Researcher
    for: questions in, findings and write-ups out
    templates: [research, writer, coordinator, support]
  consultant:
    title: Consultant
    for: client engagements backed by research and writing
    templates: [engagement, research, writer, coordinator, support]
  small-team:
    title: Small team
    for: a product with live systems and someone coordinating the work
    templates: [builder, operations, coordinator, support]
