[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto

markers =
    integration: Integration tests
    integrity: Framework integrity tests
    slow: Slow running tests
    production: Production feature tests
    live_local_probe: lets the mesh resolver probe a real local server (off by default: tests must not depend on whether serve runs on the box)
